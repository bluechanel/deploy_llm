events {
    worker_connections 1024;
}

http {
    # 定义日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # 设置日志 - 输出到标准输出/错误以便Docker可以捕获
    access_log /dev/stdout main;
    error_log /dev/stderr;

    # 定义 MIME 类型
    include mime.types;
    default_type application/octet-stream;

    # 基本设置
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;
    client_body_buffer_size 100M;

    # 定义上游服务器
    upstream chat_generate_reason {
        server chat_generate_reason:8000;
    }

    upstream chat_generate {
        server chat_generate:8000;
    }

    upstream chat_generate_vision {
        server chat_generate_vision:8000;
    }

    upstream embed {
        server embed:8000;
    }

    upstream reranker {
        server reranker:8000;
    }

    # 服务器配置
    server {
        listen 80;
        server_name localhost;

        # 公共变量定义
        set $upstream_name "";

        # 处理 /v1/chat/completions 请求，根据model参数动态路由
        location /v1/chat/completions {
            content_by_lua_block {
                local cjson = require "cjson"
                ngx.req.read_body()
                local body_data = ngx.req.get_body_data()

                if not body_data then
                    ngx.status = 400
                    ngx.say("请求体缺失")
                    return
                end

                local json, err = cjson.decode(body_data)
                if not json then
                    ngx.status = 400
                    ngx.say("无效的JSON格式: " .. err)
                    return
                end

                local model = json.model
                ngx.log(ngx.INFO, "处理 /v1/chat/completions 请求，模型: " .. tostring(model))

                -- 根据 model 参数路由到不同的 upstream
                if model == "deepseek-r1-qwen" then
                    ngx.var.upstream_name = "chat_generate_reason"
                elseif model == "qwen2.5" then
                    ngx.var.upstream_name = "chat_generate"
                elseif model == "qwen2.5vl" then
                    ngx.var.upstream_name = "chat_generate_vision"
                else
                    ngx.status = 400
                    ngx.say("无效的模型参数: " .. tostring(model))
                    return
                end

                -- 动态代理到对应的 upstream
                ngx.exec("@proxy_to_upstream")
            }
        }

        # 动态代理逻辑
        location @proxy_to_upstream {
            proxy_pass http://$upstream_name;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 支持长连接和WebSocket
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        # 静态路径代理 - 直接访问特定服务
        location /reason/v1/chat/completions {
            proxy_pass http://chat_generate_reason/v1/chat/completions;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /normal/v1/chat/completions {
            proxy_pass http://chat_generate/v1/chat/completions;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /vision/v1/chat/completions {
            proxy_pass http://chat_generate_vision/v1/chat/completions;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # embeddings service
        location /v1/embeddings {
            proxy_pass http://embed/v1/embeddings;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # reranker service
        location /rerank {
            proxy_pass http://reranker/rerank;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /v1/rerank {
            proxy_pass http://reranker/v1/rerank;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /v2/rerank {
            proxy_pass http://reranker/v2/rerank;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /health {
            return 200 'OpenResty is healthy';
            add_header Content-Type text/plain;
        }

        location / {
            error_log /dev/stderr info;
            proxy_pass http://chat_generate;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}