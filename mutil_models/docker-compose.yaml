version: "3.9"


x-vllm-common:
  &common
  image: vllm/vllm-openai:latest
  restart: unless-stopped
  environment:
    TZ: "Asia/Shanghai"
  volumes:
    - /data/models:/models # Please modify this to the actual model directory.
  networks:
    - vllm
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"


services:
  openresty:
    image: openresty/openresty:latest
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf
    networks:
      - vllm
    depends_on:
      - chat_generate_reason
      - chat_generate
      - chat_generate_vision
      - embed
      - reranker
    # 为openresty添加日志配置
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"



  chat_generate_reason:
    <<: *common
    shm_size: '10.24gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [ gpu ]
              device_ids: ['0']
      # Modify the `model` parameter to the path where you have downloaded the model, and adjust `tensor-parallel-size` according to the number of GPUs you intend to use.
    command: [ "--model","/models/deepseek-ai/DeepSeek-R1-Distill-Qwen-32B",  "--enable-prefix-caching", "--host", "0.0.0.0", "--port", "8000", "--served-model-name", "deepseek-r1-qwen", "--distributed-executor-backend","ray","--tensor-parallel-size","1","--pipeline-parallel-size", "1","--enable-reasoning","--reasoning-parser","deepseek_r1"]

  chat_generate:
    <<: *common
    shm_size: '10.24gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [ gpu ]
              device_ids: [ '1' ]
    # model 参数修改为自己下载模型的路径， tensor-parallel-size 为使用几张GPU，按实际修改
    command: [ "--model","/models/Qwen/Qwen2.5-72B-Instruct-GPTQ-Int4", "--enable-prefix-caching", "--uvicorn-log-level","debug", "--host", "0.0.0.0", "--port", "8000", "--served-model-name", "qwen2.5", "--enable-auto-tool-choice", "--tool-call-parser", "hermes","--distributed-executor-backend","ray","--tensor-parallel-size","1","--pipeline-parallel-size", "1" ]


  chat_generate_vision:
    <<: *common
    shm_size: '10.24gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [ gpu ]
              device_ids: [ '2' ]
    # model 参数修改为自己下载模型的路径， tensor-parallel-size 为使用几张GPU，按实际修改
    command: [ "--model","/models/Qwen/Qwen2.5-VL-7B-Instruct", "--enable-prefix-caching", "--uvicorn-log-level","debug", "--host", "0.0.0.0", "--port", "8000", "--served-model-name", "qwen2.5vl", "--enable-auto-tool-choice", "--tool-call-parser", "hermes","--distributed-executor-backend","ray","--tensor-parallel-size","1","--pipeline-parallel-size", "1" ]


  embed:
    <<: *common
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [ gpu ]
              device_ids: ['3']
    command: [ "--model","/models/maple77/gte-large-zh",  "--host", "0.0.0.0", "--port", "8000", "--task", "embed", "--served-model-name", "gte-large-zh"]

  reranker:
    <<: *common
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [ gpu ]
              device_ids: ['3']
    command: [ "--model","/models/maple77/bge-reranker-base",  "--host", "0.0.0.0", "--port", "8000", "--task", "score", "--served-model-name", "bge-reranker-base"]


networks:
  vllm: