version: "3.9"


x-vllm-common:
  &common
  image: vllm/vllm-openai:latest
  restart: unless-stopped
  environment:
    TZ: "Asia/Shanghai"
  volumes:
    - /data/models:/models # Please modify this to the actual model directory.
  networks:
    - vllm


services:
  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf  # 挂载nginx配置文件
    networks:
      - vllm
    depends_on:
      - chat_generate
      - embed
      - reranker


  chat_generate:
    <<: *common
    shm_size: '10.24gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
      # model 参数修改为自己下载模型的路径， tensor-parallel-size 为使用几张GPU，按实际修改
    command: [ "--model","/models/deepseek-ai/DeepSeek-R1-Distill-Qwen-32B",  "--enable-prefix-caching", "--host", "0.0.0.0", "--port", "8000", "--served-model-name", "gpt-4", "--distributed-executor-backend","ray","--tensor-parallel-size","2","--pipeline-parallel-size", "1","--enable-reasoning","--reasoning-parser","deepseek_r1"]

  embed:
    <<: *common
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [ gpu ]
              device_ids: ['3']
    command: [ "--model","/models/maple77/gte-large-zh",  "--host", "0.0.0.0", "--port", "8000", "--task", "embed", "--served-model-name", "gte-large-zh"]

  reranker:
    <<: *common
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [ gpu ]
              device_ids: ['3']
    command: [ "--model","/models/maple77/bge-reranker-base",  "--host", "0.0.0.0", "--port", "8000", "--task", "score", "--served-model-name", "bge-reranker-base"]


networks:
  vllm: